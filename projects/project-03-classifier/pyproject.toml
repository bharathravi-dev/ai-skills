[project]
name = "churnclf"
version = "0.1.0"
description = "Project 3: an honestly-evaluated churn classifier, NumPy only"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
